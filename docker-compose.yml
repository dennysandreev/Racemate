services:
  web:
    build: .
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - .env
    command: ["node", "worker/index.mjs", "rss.fetch_all"]
    restart: "no"

  admin-job-runner:
    build: .
    env_file:
      - .env
    command:
      - sh
      - -lc
      - |
        heartbeat_count=0
        while true; do
          if [ "$heartbeat_count" -le 0 ]; then
            node worker/index.mjs ops.heartbeat --service admin-job-runner || true
            heartbeat_count=10
          fi
          node worker/index.mjs jobs.consume_queued --limit 3 || true
          heartbeat_count=$((heartbeat_count - 1))
          sleep 3
        done
    restart: unless-stopped

  cron:
    build: .
    env_file:
      - .env
    command:
      - sh
      - -lc
      - |
        while true; do
          node worker/index.mjs ops.heartbeat --service cron || true
          node worker/index.mjs jobs.enqueue_schedules --limit 20 || true
          sleep 15
        done
    restart: unless-stopped
