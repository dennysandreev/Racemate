x-app-build: &app-build
  context: .
  args:
    NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
    NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0.1}
    SENTRY_ORG: ${SENTRY_ORG:-}
    SENTRY_PROJECT: ${SENTRY_PROJECT:-}
    SENTRY_RELEASE: ${SENTRY_RELEASE:-${RACESIDE_RELEASE_SHA:-}}

services:
  web:
    build: *app-build
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped

  worker:
    build: *app-build
    env_file:
      - .env
    command: ["node", "worker/cli.mjs", "rss.fetch_all"]
    healthcheck:
      disable: true
    restart: "no"

  admin-job-runner:
    build: *app-build
    env_file:
      - .env
    command:
      - sh
      - -lc
      - |
        heartbeat_count=0
        while true; do
          if [ "$$heartbeat_count" -le 0 ]; then
            node worker/cli.mjs ops.heartbeat --service admin-job-runner || true
            heartbeat_count=10
          fi
          node worker/cli.mjs jobs.consume_queued --limit 3 || true
          heartbeat_count=$$((heartbeat_count - 1))
          sleep 3
        done
    healthcheck:
      disable: true
    restart: unless-stopped

  cron:
    build: *app-build
    env_file:
      - .env
    command:
      - sh
      - -lc
      - |
        while true; do
          node worker/cli.mjs ops.heartbeat --service cron || true
          node worker/cli.mjs jobs.enqueue_schedules --limit 20 || true
          sleep 15
        done
    healthcheck:
      disable: true
    restart: unless-stopped
