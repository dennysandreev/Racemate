services:
  web:
    build: .
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - .env
    command: ["node", "worker/index.mjs", "rss.fetch_all"]
    restart: "no"

  admin-job-runner:
    build: .
    env_file:
      - .env
    command:
      - sh
      - -lc
      - |
        while true; do
          node worker/index.mjs jobs.consume_queued --limit 3 || true
          sleep 3
        done
    restart: unless-stopped

  cron:
    build: .
    env_file:
      - .env
    command:
      - sh
      - -lc
      - |
        while true; do
          node worker/index.mjs jobs.enqueue_schedules --limit 20 || true
          sleep 15
        done
    restart: unless-stopped
