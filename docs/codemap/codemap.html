<script>
(function(){

function visibleNodes(){return data.nodes.filter(function(n){return enabledTypes.has(n.type)})}
function layout(nodes){

  for(var bi=1;bi<boundaryOrder.length;bi++){var current=boundaryOrder[bi],prev=posMap(boundaryOrder[bi-1]);order.get(current).sort(function(a,b){return bary(a,prev)-bary(b,prev)||a.title.localeCompare(b.title)})}

}
